aid: 360-commerce
name: 360 Commerce
description: '360 Commerce is a New Zealand and Australia B2B ecommerce platform that helps wholesalers,
  distributors and manufacturers bring customer ordering, account self-service and ERP-connected workflows
  online. More than a standard ecommerce website, it gives customers a secure ordering portal for contract
  and customer-specific pricing, ERP stock visibility, repeat ordering, quotes, approvals, invoices, credit
  notes and aged balances. The platform (built on its EcomCore product) integrates with leading ERP, accounting,
  inventory and CRM systems including Odoo, MYOB Advanced and NetSuite so online ordering reflects the way a
  business actually trades.'
